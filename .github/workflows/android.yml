name: Android APK

# Native layer only. Web pushes are deployed by Vercel and reach the existing
# APK instantly; rebuilding here would waste CI and churn the release feed.
on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.ts"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. See docs/native-build.md."
            exit 1
          fi
          # Kept outside the checkout so it can never be committed or packaged.
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ndjourney-release.jks"
          echo "Restored release keystore."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/ndjourney-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Write update manifest
        run: |
          jq -n \
            --argjson build "$ANDROID_VERSION_CODE" \
            --arg version "$ANDROID_VERSION_NAME" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/app-release.apk" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Build otomatis ${GITHUB_SHA::7}" \
            '{build:$build,version:$version,apkUrl:$apkUrl,releasedAt:$releasedAt,notes:$notes}' \
            > native-version.json
          cat native-version.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: native-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            native-version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
