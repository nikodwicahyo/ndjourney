name: Android APK

# Native layer only. Web pushes are deployed by Vercel and reach the existing
# APK instantly; rebuilding here would waste CI and churn the release feed.
on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.ts"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Restore and verify release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are missing. See docs/native-build.md."
            exit 1
          fi
          # Trim whitespace accidentally pasted into the secrets UI.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASSWORD="$(trim "$STORE_PASSWORD")"
          KEY_ALIAS="$(trim "$KEY_ALIAS")"
          KEY_PASSWORD="$(trim "$KEY_PASSWORD")"
          KEYSTORE="$RUNNER_TEMP/ndjourney-release.jks"

          # Kept outside the checkout so it can never be committed or packaged.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 --decode > "$KEYSTORE"

          if ! KEYTOOL_INFO="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1)"; then
            echo "::error::Keystore/store password/alias mismatch. Check ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS."
            exit 1
          fi

          # PKCS12 (keytool default on JDK 9+) has no separate key password —
          # the key is protected by the store password. Detect it instead of
          # trusting -keypass, which keytool silently ignores for PKCS12.
          if printf '%s' "$KEYTOOL_INFO" | grep -qi 'Keystore type: *PKCS12'; then
            RESOLVED_KEY_PASSWORD="$STORE_PASSWORD"
          elif keytool -certreq -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -file /dev/null >/dev/null 2>&1; then
            RESOLVED_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo "::error::Cannot read the signing key. Check ANDROID_RELEASE_KEY_PASSWORD and ANDROID_RELEASE_KEY_ALIAS."
            exit 1
          fi

          echo "ANDROID_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$RESOLVED_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Restored and verified release keystore."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/ndjourney-release.jks
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Write update manifest
        run: |
          jq -n \
            --argjson build "$ANDROID_VERSION_CODE" \
            --arg version "$ANDROID_VERSION_NAME" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/app-release.apk" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "Build otomatis ${GITHUB_SHA::7}" \
            '{build:$build,version:$version,apkUrl:$apkUrl,releasedAt:$releasedAt,notes:$notes}' \
            > native-version.json
          cat native-version.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: native-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            native-version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
