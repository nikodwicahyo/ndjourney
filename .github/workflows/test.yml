name: test
on: [push, pull_request]

# C-05/C-07: one run per ref (no push+PR doubles), least-privilege token,
# no 6-hour burns on a hung runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma validate
      # C-10: visibility only — the repo currently has known advisories, so a
      # gating audit would red-X every PR until the upgrade backlog is cleared.
      - run: npm run security:audit
        continue-on-error: true
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # C-05: fork PRs have no secrets; the mocked suites don't need them.
    # E2E runs locally only (needs a live test DB + browsers), not in CI.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:unit
      - run: npm run test:integration
        env:
          INVITE_TOKEN: test-invite-123
          CRON_SECRET: test-cron-secret
